# AFBench Testonly Configuration
# Minimal, deterministic, fast configuration for testing pipeline behavior

# Data directory - isolated testonly data
data_dir: "data/testonly"

# Model pool configuration - use minimal testonly pool
model_pool:
  default_pool: "testonly"
  pools_dir: "model_pools"

# Judge pool configuration - use minimal testonly pool  
judge_pool:
  default_pool: "testonly"
  pools_dir: "judge_pools"

# Skills configuration - use minimal testonly skills
skills:
  skills_dir: "testonly/skills"
  selected_skills: []  # Load all skills in testonly directory

# Minimal data generation for fast testing
n_samples: 10
random_seed: 12345  # Fixed seed for deterministic results

# Fast processing parameters
processing:
  remove_outliers: false
  outlier_threshold: 3.0
  normalize: true

# Analysis parameters
analysis:
  statistical_tests: false
  correlation_analysis: false
  significance_level: 0.05

# Minimal plotting parameters
plotting:
  figure_size: [6, 4]
  dpi: 100
  style: "default"

# Report parameters
report:
  include_plots: false
  format: "json"
  timestamp: true