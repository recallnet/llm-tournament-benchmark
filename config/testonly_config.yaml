# AFBench Test-Only Configuration
# Only for automated tests - minimal models/judges for speed

# Data directory - isolated test-only data
data_dir: "data/testonly"

# Model pool configuration - use minimal test pool
model_pool:
  default_pool: "testonly"
  pools_dir: "model_pools"

# Judge pool configuration - use minimal test pool
judge_pool:
  default_pool: "testonly"
  pools_dir: "judge_pools"

# Skills configuration
skills:
  skills_dir: "skills"
  selected_skills: []

# Minimal data generation for tests
n_samples: 10
random_seed: 42

# Fast processing for tests
processing:
  remove_outliers: false
  normalize: false

# Analysis parameters
analysis:
  statistical_tests: false
  correlation_analysis: false

# Minimal plotting for tests
plotting:
  figure_size: [4, 3]
  dpi: 72

# Report parameters
report:
  include_plots: false
  format: "json"
  timestamp: false