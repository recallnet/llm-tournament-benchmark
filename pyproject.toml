[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afbench"
version = "0.1.0"
description = "Snakemake-based data processing pipeline with rigorous QA standards"
requires-python = ">=3.11"
dependencies = [
    "snakemake>=7.0.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "isort>=5.12.0",
    "bandit>=1.7.0",
    "safety>=2.3.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pre-commit>=3.0.0",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
show_error_codes = true

[tool.black]
line-length = 127
target-version = ['py311']

[tool.ruff]
line-length = 127
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PLR", "TRY", "PTH", "PT"]
ignore = ["TRY003"]  # Long exception messages

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "tuple"

# Enforce test organization
[tool.ruff.lint.per-file-ignores]
# Allow test files only in tests/ directory
"!tests/**/*test*.py" = ["PT"]
"!tests/**/test_*.py" = ["PT"] 
# Scripts directory should not contain test functions
"scripts/**/*.py" = ["PT011", "PT012", "PT013"]

[tool.isort]
profile = "black"
line_length = 127

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["scripts"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # Skip assert_used test