[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True
show_error_codes = True

# Ignore missing imports for third-party packages
ignore_missing_imports = True

# Handle Snakemake scripts - they inject 'snakemake' as a global
[mypy-scripts.*]
disable_error_code = name-defined

# Allow untyped defs in legacy template scripts for now
[mypy-scripts.analyze_data]
disallow_untyped_defs = False
[mypy-scripts.create_plots]
disallow_untyped_defs = False
[mypy-scripts.generate_data]
disallow_untyped_defs = False
[mypy-scripts.generate_report]
disallow_untyped_defs = False
[mypy-scripts.process_data]
disallow_untyped_defs = False